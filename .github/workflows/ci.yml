name: MVP checks
on:
  push:
  pull_request:
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_TELEMETRY_DISABLED: '1'
      SUPABASE_HOME: ${{ github.workspace }}/supabase/.temp/cli-home
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:start
      - run: npm run db:configure
      - run: npm run check:local -- test:db
      - run: npm run check:local -- test:auth
      - run: npx playwright install --with-deps chromium
      - run: npm run check:local -- test:e2e
      - run: npm run build
      - name: Save browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics
          path: test-results/
          retention-days: 7
      - name: Stop local backend
        if: always()
        run: npm run db:stop
